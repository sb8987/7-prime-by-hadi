<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Prime | Advanced Master Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        :root {
            --gold-primary: #D4AF37;
            --bg-dark: #070709;
            --card-bg: rgba(18, 18, 24, 0.95);
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 25px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFF6D5, #D4AF37, #AA7C11);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-title {
            font-size: 16px;
            color: #D4AF37;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media(min-width: 600px) {
            .form-grid { grid-template-columns: repeat(2, 1fr); }
            .full-width { grid-column: span 2; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
        }

        .input-group input, .input-group select, .input-group textarea {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #D4AF37;
        }

        .btn-action {
            background: linear-gradient(135deg, #D4AF37, #B8860B);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-action:hover {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Image Previews */
        .preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preview-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #D4AF37;
        }

        /* Product List Styles */
        .item-row {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
        }

        .item-row img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }

        .item-meta {
            flex-grow: 1;
        }

        .item-meta h4 { font-size: 14px; color: #fff; }
        .item-meta p { font-size: 12px; color: #D4AF37; }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: rgba(212, 175, 55, 0.2);
            color: #D4AF37;
            border: 1px solid #D4AF37;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-delete {
            background: rgba(255, 77, 77, 0.2);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="brand-title">7 PRIME MASTER ADMIN</div>
            <div style="font-size: 10px; color: #888;">THEME, PRODUCTS & TESTER CONTROLLER</div>
        </div>
        <a href="index.html" target="_blank" style="color: #D4AF37; font-size: 12px; text-decoration: none; border: 1px solid #D4AF37; padding: 5px 12px; border-radius: 15px;">View Live Store ↗</a>
    </div>

    <!-- 1. THEME CUSTOMIZER -->
    <div class="section-card">
        <div class="section-title">🎨 Website Theme Switcher</div>
        <div class="form-grid">
            <div class="input-group full-width">
                <label>Select Store Color Theme</label>
                <select id="themeSelect" onchange="saveTheme()">
                    <option value="gold">Royal Dark Gold (Default)</option>
                    <option value="emerald">Emerald Night & Gold</option>
                    <option value="rosegold">Rose Gold Luxury</option>
                    <option value="midnight">Midnight Silver</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 2. TESTER BOX EDITOR -->
    <div class="section-card">
        <div class="section-title">🧪 Edit Tester / Discovery Box Details</div>
        <form onsubmit="saveTesterData(event)" class="form-grid">
            <div class="input-group">
                <label>Tester Title</label>
                <input type="text" id="tTitle" placeholder="7 Prime Discovery Set" required>
            </div>
            <div class="input-group">
                <label>Price (PKR)</label>
                <input type="number" id="tPrice" placeholder="1200" required>
            </div>
            <div class="input-group full-width">
                <label>Description</label>
                <input type="text" id="tDesc" placeholder="Includes 5ml sample testers for all signature scents." required>
            </div>
            <button type="submit" class="btn-action full-width">Update Tester Box Info</button>
        </form>
    </div>

    <!-- 3. ADD / EDIT PERFUME FORM -->
    <div class="section-card">
        <div class="section-title">
            <span id="formModeTitle">✨ Add New Perfume</span>
            <button type="button" id="cancelEditBtn" onclick="resetForm()" style="display:none; background:none; border:none; color:#ff4d4d; font-size:11px; cursor:pointer;">Cancel Edit</button>
        </div>
        
        <form id="perfumeForm" onsubmit="handleFormSubmit(event)" class="form-grid">
            <input type="hidden" id="editIndex" value="-1">

            <div class="input-group">
                <label>Perfume Name *</label>
                <input type="text" id="pName" placeholder="e.g. 7 Seven Prime Signature" required>
            </div>

            <div class="input-group">
                <label>Price in PKR *</label>
                <input type="number" id="pPrice" placeholder="e.g. 4999" required>
            </div>

            <div class="input-group">
                <label>Original Cut Price (PKR) *</label>
                <input type="number" id="pOldPrice" placeholder="e.g. 6500" required>
            </div>

            <div class="input-group">
                <label>Volume / Size *</label>
                <input type="text" id="pVolume" value="100 ml" required>
            </div>

            <div class="input-group full-width">
                <label>Upload Gallery Pictures (Multiple Local Pics Supported) *</label>
                <input type="file" id="pFiles" accept="image/*" multiple onchange="previewImages(event)">
                <div id="imagePreviews" class="preview-container"></div>
            </div>

            <div class="input-group">
                <label>Top Note</label>
                <input type="text" id="pTop" placeholder="e.g. Italian Bergamot">
            </div>

            <div class="input-group">
                <label>Heart Note</label>
                <input type="text" id="pHeart" placeholder="e.g. Turkish Rose">
            </div>

            <div class="input-group full-width">
                <label>Base Note</label>
                <input type="text" id="pBase" placeholder="e.g. Royal Oud">
            </div>

            <button type="submit" id="submitBtn" class="btn-action full-width">Save Perfume To Store</button>
        </form>
    </div>

    <!-- 4. LIVE PRODUCTS MANAGER -->
    <div class="section-card">
        <div class="section-title">📦 Manage Live Products</div>
        <div id="productsList"></div>
    </div>

    <script>
        let currentBase64Images = [];

        // Preview and Convert Images to Base64
        function previewImages(event) {
            const files = event.target.files;
            const previewContainer = document.getElementById('imagePreviews');
            previewContainer.innerHTML = '';
            currentBase64Images = [];

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Images.push(e.target.result);
                    previewContainer.innerHTML += `<img src="${e.target.result}" class="preview-thumb">`;
                };
                reader.readAsDataURL(file);
            });
        }

        // Fetch Data
        function getData(key, defaultValue) {
            return JSON.parse(localStorage.getItem(key)) || defaultValue;
        }

        function setData(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        // Load Initial Admin Values
        function loadAdmin() {
            // Theme
            document.getElementById('themeSelect').value = getData('hadi_theme', 'gold');

            // Tester
            const tester = getData('hadi_tester', {
                title: "7 Prime Discovery Set (5ml Testers)",
                price: 1200,
                desc: "Not sure which one to pick? Order our 5ml Discovery Sample Set to experience all signature scents before buying full bottles."
            });
            document.getElementById('tTitle').value = tester.title;
            document.getElementById('tPrice').value = tester.price;
            document.getElementById('tDesc').value = tester.desc;

            // Products
            renderProductsList();
        }

        function saveTheme() {
            const val = document.getElementById('themeSelect').value;
            setData('hadi_theme', val);
            alert("Theme Updated!");
        }

        function saveTesterData(e) {
            e.preventDefault();
            const tester = {
                title: document.getElementById('tTitle').value,
                price: parseInt(document.getElementById('tPrice').value),
                desc: document.getElementById('tDesc').value
            };
            setData('hadi_tester', tester);
            alert("Tester Box Updated Successfully!");
        }

        // Render List
        function renderProductsList() {
            const products = getData('hadi_perfumes', []);
            const container = document.getElementById('productsList');
            container.innerHTML = '';

            if(products.length === 0) {
                container.innerHTML = `<p style="color:#666; font-size:12px;">No products added yet.</p>`;
                return;
            }

            products.forEach((p, idx) => {
                const img = (p.images && p.images.length > 0) ? p.images[0] : (p.image || '');
                container.innerHTML += `
                    <div class="item-row">
                        <img src="${img}" alt="pic">
                        <div class="item-meta">
                            <h4>${p.name} (${p.volume})</h4>
                            <p>PKR ${p.pricePKR}</p>
                        </div>
                        <div class="btn-group">
                            <button onclick="editProduct(${idx})" class="btn-edit">Edit</button>
                            <button onclick="deleteProduct(${idx})" class="btn-delete">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        // Form Submit (Add or Edit)
        function handleFormSubmit(e) {
            e.preventDefault();
            const editIdx = parseInt(document.getElementById('editIndex').value);
            const products = getData('hadi_perfumes', []);

            let imagesToSave = currentBase64Images;
            if(imagesToSave.length === 0 && editIdx !== -1) {
                imagesToSave = products[editIdx].images || [products[editIdx].image];
            }

            const item = {
                id: editIdx === -1 ? Date.now() : products[editIdx].id,
                name: document.getElementById('pName').value,
                pricePKR: parseInt(document.getElementById('pPrice').value),
                oldPricePKR: parseInt(document.getElementById('pOldPrice').value),
                volume: document.getElementById('pVolume').value,
                images: imagesToSave,
                image: imagesToSave[0] || '',
                top: document.getElementById('pTop').value,
                heart: document.getElementById('pHeart').value,
                base: document.getElementById('pBase').value
            };

            if(editIdx === -1) {
                products.push(item);
            } else {
                products[editIdx] = item;
            }

            setData('hadi_perfumes', products);
            resetForm();
            renderProductsList();
            alert("Product Saved Successfully!");
        }

        function editProduct(idx) {
            const products = getData('hadi_perfumes', []);
            const p = products[idx];

            document.getElementById('editIndex').value = idx;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.pricePKR;
            document.getElementById('pOldPrice').value = p.oldPricePKR;
            document.getElementById('pVolume').value = p.volume;
            document.getElementById('pTop').value = p.top || '';
            document.getElementById('pHeart').value = p.heart || '';
            document.getElementById('pBase').value = p.base || '';

            document.getElementById('formModeTitle').innerText = "✏️ Edit Perfume Details";
            document.getElementById('submitBtn').innerText = "Update Perfume";
            document.getElementById('cancelEditBtn').style.display = "inline";

            const previewContainer = document.getElementById('imagePreviews');
            previewContainer.innerHTML = '';
            const imgs = p.images || [p.image];
            imgs.forEach(src => {
                previewContainer.innerHTML += `<img src="${src}" class="preview-thumb">`;
            });
            currentBase64Images = [];
        }

        function deleteProduct(idx) {
            if(confirm("Are you sure you want to delete this perfume?")) {
                const products = getData('hadi_perfumes', []);
                products.splice(idx, 1);
                setData('hadi_perfumes', products);
                renderProductsList();
            }
        }

        function resetForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('editIndex').value = "-1";
            document.getElementById('formModeTitle').innerText = "✨ Add New Perfume";
            document.getElementById('submitBtn').innerText = "Save Perfume To Store";
            document.getElementById('cancelEditBtn').style.display = "none";
            document.getElementById('imagePreviews').innerHTML = '';
            currentBase64Images = [];
        }

        loadAdmin();
    </script>
</body>
</html>
