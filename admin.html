<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Prime | Realtime Master Admin</title>
    <!-- Firebase App & Database Compatibility Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        :root { --gold-primary: #D4AF37; --bg-dark: #070709; --card-bg: rgba(18, 18, 24, 0.95); }
        body { background-color: var(--bg-dark); color: #ffffff; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); margin-bottom: 25px; }
        .brand-title { font-size: 22px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #FFF6D5, #D4AF37, #AA7C11); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-card { background: var(--card-bg); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 16px; padding: 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .section-title { font-size: 16px; color: #D4AF37; margin-bottom: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media(min-width: 600px) { .form-grid { grid-template-columns: repeat(2, 1fr); } .full-width { grid-column: span 2; } }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: #aaa; text-transform: uppercase; }
        .input-group input, .input-group select, .input-group textarea { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; outline: none; }
        .input-group input:focus { border-color: #D4AF37; }
        .btn-action { background: linear-gradient(135deg, #D4AF37, #B8860B); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 12px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; }
        .preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .preview-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid #D4AF37; }
        .item-row { background: rgba(0,0,0,0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 10px; }
        .item-row img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .item-meta { flex-grow: 1; }
        .item-meta h4 { font-size: 14px; color: #fff; }
        .item-meta p { font-size: 12px; color: #D4AF37; }
        .btn-group { display: flex; gap: 8px; }
        .btn-edit { background: rgba(212, 175, 55, 0.2); color: #D4AF37; border: 1px solid #D4AF37; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .btn-delete { background: rgba(255, 77, 77, 0.2); color: #ff4d4d; border: 1px solid #ff4d4d; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .sync-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; background: rgba(0,255,0,0.15); color: #00ff88; border: 1px solid #00ff88; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="brand-title">7 PRIME MASTER ADMIN</div>
            <div style="font-size: 10px; color: #888;">GLOBAL REALTIME SYNC <span class="sync-badge">● LIVE</span></div>
        </div>
        <a href="index.html" target="_blank" style="color: #D4AF37; font-size: 12px; text-decoration: none; border: 1px solid #D4AF37; padding: 5px 12px; border-radius: 15px;">View Live Store ↗</a>
    </div>

    <!-- 1. THEME CUSTOMIZER -->
    <div class="section-card">
        <div class="section-title">🎨 Website Theme Switcher</div>
        <div class="form-grid">
            <div class="input-group full-width">
                <label>Select Store Color Theme</label>
                <select id="themeSelect" onchange="saveTheme()">
                    <option value="gold">Royal Dark Gold (Default)</option>
                    <option value="emerald">Emerald Night & Gold</option>
                    <option value="rosegold">Rose Gold Luxury</option>
                    <option value="midnight">Midnight Silver</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 2. TESTER BOX EDITOR -->
    <div class="section-card">
        <div class="section-title">🧪 Edit Tester / Discovery Box Details</div>
        <form onsubmit="saveTesterData(event)" class="form-grid">
            <div class="input-group">
                <label>Tester Title</label>
                <input type="text" id="tTitle" placeholder="7 Prime Discovery Set" required>
            </div>
            <div class="input-group">
                <label>Price (PKR)</label>
                <input type="number" id="tPrice" placeholder="1200" required>
            </div>
            <div class="input-group full-width">
                <label>Description</label>
                <input type="text" id="tDesc" placeholder="Includes sample testers for signature scents." required>
            </div>
            <button type="submit" class="btn-action full-width">Update Tester Box Info</button>
        </form>
    </div>

    <!-- 3. ADD / EDIT PERFUME FORM -->
    <div class="section-card">
        <div class="section-title">
            <span id="formModeTitle">✨ Add New Perfume</span>
            <button type="button" id="cancelEditBtn" onclick="resetForm()" style="display:none; background:none; border:none; color:#ff4d4d; font-size:11px; cursor:pointer;">Cancel Edit</button>
        </div>
        
        <form id="perfumeForm" onsubmit="handleFormSubmit(event)" class="form-grid">
            <input type="hidden" id="editKey" value="">

            <div class="input-group">
                <label>Perfume Name *</label>
                <input type="text" id="pName" placeholder="e.g. 7 Seven Prime Signature" required>
            </div>

            <div class="input-group">
                <label>Price in PKR *</label>
                <input type="number" id="pPrice" placeholder="e.g. 4999" required>
            </div>

            <div class="input-group">
                <label>Original Cut Price (Optional PKR)</label>
                <input type="number" id="pOldPrice" placeholder="e.g. 6500">
            </div>

            <div class="input-group">
                <label>Volume / Size *</label>
                <input type="text" id="pVolume" value="100 ml" required>
            </div>

            <div class="input-group full-width">
                <label>Upload Gallery Pictures (Select Local Pics)</label>
                <input type="file" id="pFiles" accept="image/*" multiple onchange="previewImages(event)">
                <div id="imagePreviews" class="preview-container"></div>
            </div>

            <div class="input-group">
                <label>Top Note</label>
                <input type="text" id="pTop" placeholder="e.g. Italian Bergamot & Spiced Cardamom">
            </div>

            <div class="input-group">
                <label>Heart Note</label>
                <input type="text" id="pHeart" placeholder="e.g. Royal Turkish Rose & Amber">
            </div>

            <div class="input-group full-width">
                <label>Base Note</label>
                <input type="text" id="pBase" placeholder="e.g. Cambodian Oud & Sandalwood">
            </div>

            <button type="submit" id="submitBtn" class="btn-action full-width">Save Perfume To Global Store</button>
        </form>
    </div>

    <!-- 4. LIVE PRODUCTS MANAGER -->
    <div class="section-card">
        <div class="section-title">📦 Manage Live Products</div>
        <div id="productsList">Loading Products from Global Database...</div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyRIjanyxV-71boLBvpUxBlQm-HgYy1f0Xc",
            authDomain: "seven-prime-by-hadi.firebaseapp.com",
            databaseURL: "https://seven-prime-by-hadi-default-rtdb.firebaseio.com",
            projectId: "seven-prime-by-hadi",
            storageBucket: "seven-prime-by-hadi.firebasestorage.app",
            messagingSenderId: "565525923161",
            appId: "1:565525923161:web:3886d43atec0095193848"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentBase64Images = [];
        let globalProducts = {};

        function previewImages(event) {
            const files = event.target.files;
            const previewContainer = document.getElementById('imagePreviews');
            previewContainer.innerHTML = '';
            currentBase64Images = [];

            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Images.push(e.target.result);
                    previewContainer.innerHTML += `<img src="${e.target.result}" class="preview-thumb">`;
                };
                reader.readAsDataURL(file);
            });
        }

        // Listen for Realtime DB Changes
        db.ref('store_theme').on('value', snap => {
            if(snap.exists()) document.getElementById('themeSelect').value = snap.val();
        });

        db.ref('tester_box').on('value', snap => {
            if(snap.exists()){
                const t = snap.val();
                document.getElementById('tTitle').value = t.title || '';
                document.getElementById('tPrice').value = t.price || '';
                document.getElementById('tDesc').value = t.desc || '';
            }
        });

        db.ref('products').on('value', snap => {
            globalProducts = snap.val() || {};
            renderProductsList();
        });

        function saveTheme() {
            const val = document.getElementById('themeSelect').value;
            db.ref('store_theme').set(val);
            alert("Theme Updated Globally!");
        }

        function saveTesterData(e) {
            e.preventDefault();
            const tester = {
                title: document.getElementById('tTitle').value,
                price: parseInt(document.getElementById('tPrice').value) || 0,
                desc: document.getElementById('tDesc').value
            };
            db.ref('tester_box').set(tester);
            alert("Tester Box Updated Globally!");
        }

        function renderProductsList() {
            const container = document.getElementById('productsList');
            container.innerHTML = '';

            const keys = Object.keys(globalProducts);
            if(keys.length === 0) {
                container.innerHTML = `<p style="color:#666; font-size:12px;">No products in database yet.</p>`;
                return;
            }

            keys.forEach(key => {
                const p = globalProducts[key];
                const img = (p.images && p.images.length > 0) ? p.images[0] : (p.image || 'https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&q=80&w=400');
                container.innerHTML += `
                    <div class="item-row">
                        <img src="${img}" alt="pic">
                        <div class="item-meta">
                            <h4>${p.name} (${p.volume})</h4>
                            <p>PKR ${p.pricePKR}</p>
                        </div>
                        <div class="btn-group">
                            <button onclick="editProduct('${key}')" class="btn-edit">Edit</button>
                            <button onclick="deleteProduct('${key}')" class="btn-delete">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editKey = document.getElementById('editKey').value;

            let imagesToSave = currentBase64Images;
            if(imagesToSave.length === 0) {
                if(editKey && globalProducts[editKey]) {
                    imagesToSave = globalProducts[editKey].images || [globalProducts[editKey].image];
                } else {
                    imagesToSave = ['https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&q=80&w=600'];
                }
            }

            const pPriceVal = parseInt(document.getElementById('pPrice').value);
            const pOldPriceInput = document.getElementById('pOldPrice').value;
            const pOldPriceVal = pOldPriceInput ? parseInt(pOldPriceInput) : (pPriceVal + 1500);

            const item = {
                name: document.getElementById('pName').value,
                pricePKR: pPriceVal,
                oldPricePKR: pOldPriceVal,
                volume: document.getElementById('pVolume').value || "100 ml",
                images: imagesToSave,
                image: imagesToSave[0] || '',
                top: document.getElementById('pTop').value || "Italian Bergamot & Spiced Cardamom",
                heart: document.getElementById('pHeart').value || "Royal Turkish Rose & Amber",
                base: document.getElementById('pBase').value || "Cambodian Oud & Sandalwood"
            };

            if(editKey) {
                db.ref('products/' + editKey).set(item);
            } else {
                db.ref('products').push(item);
            }

            resetForm();
            alert("Perfume Saved Live To All Devices!");
        }

        function editProduct(key) {
            const p = globalProducts[key];
            document.getElementById('editKey').value = key;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.pricePKR;
            document.getElementById('pOldPrice').value = p.oldPricePKR || '';
            document.getElementById('pVolume').value = p.volume;
            document.getElementById('pTop').value = p.top || '';
            document.getElementById('pHeart').value = p.heart || '';
            document.getElementById('pBase').value = p.base || '';

            document.getElementById('formModeTitle').innerText = "✏️ Edit Perfume Details";
            document.getElementById('submitBtn').innerText = "Update Global Perfume";
            document.getElementById('cancelEditBtn').style.display = "inline";

            const previewContainer = document.getElementById('imagePreviews');
            previewContainer.innerHTML = '';
            const imgs = p.images || [p.image];
            imgs.forEach(src => {
                if(src) previewContainer.innerHTML += `<img src="${src}" class="preview-thumb">`;
            });
            currentBase64Images = [];
        }

        function deleteProduct(key) {
            if(confirm("Are you sure you want to delete this perfume globally?")) {
                db.ref('products/' + key).remove();
            }
        }

        function resetForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('editKey').value = "";
            document.getElementById('formModeTitle').innerText = "✨ Add New Perfume";
            document.getElementById('submitBtn').innerText = "Save Perfume To Global Store";
            document.getElementById('cancelEditBtn').style.display = "none";
            document.getElementById('imagePreviews').innerHTML = '';
            currentBase64Images = [];
        }
    </script>
</body>
</html>
